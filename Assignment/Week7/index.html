
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #1e293b;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-button {
            padding: 10px 18px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        
.banner {
    min-height: 350px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    background-color: #dbeafe;
    color: #1e293b;
}

.banner h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.banner p {
    font-size: 18px;
    max-width: 600px;
    line-height: 1.6;
}


    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">FlexSpace</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#about">About</a>
            <button class="nav-button">Get Started</button>
        </div>
    </nav>

    
<section class="banner" id="home">
    <h1>Build Something Amazing</h1>
    <p>
        Discover new ideas, learn modern skills, and create projects
        that bring your imagination to life.
    </p>
    <button class="nav-button">Explore Now</button>
</section>

</body>
</html>
