<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club - Registration</title>
</head>
<body>

    <header>
        <h1>Our Tech Club</h1>
        <p>Explore Technology. Build Innovation.</p>
    </header>

    <main>
        <h2>Student Registration</h2>

        <form>
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <br>

            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <br>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>
            </div>

            <br>

            <br>

<div>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>
</div>

<br>

<div>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone"
           placeholder="Enter your phone number"
           pattern="[0-9]{10}" required>
</div>

<br>

<fieldset>
    <legend>Gender:</legend>

    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>

    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>
</fieldset>

<br>

<fieldset>
    <legend>Areas of Interest:</legend>

    <input type="checkbox" id="coding" name="interests" value="coding">
    <label for="coding">Coding</label>

    <input type="checkbox" id="web" name="interests" value="web-development">
    <label for="web">Web Development</label>

    <input type="checkbox" id="ai" name="interests" value="ai">
    <label for="ai">Artificial Intelligence</label>
</fieldset>

<br>

<div>
    <label for="course">Select Your Course:</label>

    <select id="course" name="course" required>
        <option value="">-- Select a Course --</option>
        <option value="web-development">Web Development</option>
        <option value="java">Java Programming</option>
        <option value="python">Python Programming</option>
        <option value="ai-ml">AI & Machine Learning</option>
    </select>
</div>

<br>

<div>
    <label for="message">Why do you want to join our Tech Club?</label>
    <br>
    <textarea id="message" name="message" rows="4" cols="40"
              placeholder="Write your message here..."></textarea>
</div>

<br>

            <button type="submit">Register</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Our Tech Club</p>
    </footer>

</body>
</html>
