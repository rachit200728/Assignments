<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        h1 {
            text-align: center;
        }

        .grid-demo {
        display: grid;
         grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 30px;
        }

        .box {
            padding: 30px;
            background-color: #dbeafe;
            border: 2px solid #2563eb;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
        }

        .dashboard {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-areas:
        "head head"
        "side main"
        "foot foot";
    gap: 15px;
}

.head {
    grid-area: head;
    background-color: #1e293b;
    color: white;
    padding: 20px;
}

.side {
    grid-area: side;
    background-color: #dbeafe;
    padding: 20px;
}

.main {
    grid-area: main;
    background-color: white;
    padding: 20px;
}

.foot {
    grid-area: foot;
    background-color: #1e293b;
    color: white;
    padding: 15px;
    text-align: center;
}

.dashboard-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.dashboard-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background-color: #f8fafc;
}

.card-icon {
    font-size: 30px;
}

.card-text h3 {
    margin: 0 0 8px;
    font-size: 16px;
}

.card-text p {
    margin: 0;
    color: #64748b;
}
    </style>
</head>

<body>

    <div class="dashboard">

    <header class="head">
        <h1>My Dashboard</h1>
    </header>

    <aside class="side">
        <h2>Sidebar</h2>
        <p>Home</p>
        <p>Profile</p>
        <p>Settings</p>
    </aside>

    <main class="main">
        <h2>Main Content</h2>
<p>Welcome to your CSS Grid dashboard!</p>

<div class="dashboard-cards">

    <div class="dashboard-card">
        <span class="card-icon">📊</span>
        <div class="card-text">
            <h3>Analytics</h3>
            <p>View your reports</p>
        </div>
    </div>

    <div class="dashboard-card">
        <span class="card-icon">👥</span>
        <div class="card-text">
            <h3>Users</h3>
            <p>Manage your users</p>
        </div>
    </div>

    <div class="dashboard-card">
        <span class="card-icon">📁</span>
        <div class="card-text">
            <h3>Projects</h3>
            <p>Track your projects</p>
        </div>
    </div>

    <div class="dashboard-card">
        <span class="card-icon">⚙️</span>
        <div class="card-text">
            <h3>Settings</h3>
            <p>Manage preferences</p>
        </div>
    </div>

</div>
    </main>

    <footer class="foot">
        <p>My Dashboard | 2026</p>
    </footer>

</div>
</body>
</html>
